services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meusaldo}
      POSTGRES_USER: ${POSTGRES_USER:-meusaldo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meusaldo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meusaldo} -d ${POSTGRES_DB:-meusaldo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-meusaldo}:${POSTGRES_PASSWORD:-meusaldo}@db:5432/${POSTGRES_DB:-meusaldo}
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./backend:/app
    ports:
      - "38000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    # As migrações rodam a cada start para que o schema acompanhe o
    # código (T-070); manualmente: docker compose exec backend alembic upgrade head
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
